<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Illustration of website ownership: a folder of website files with a key, moving from one hand to another, with no monthly bill">
  <defs>
    <linearGradient id="bo-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#140b1e"/>
      <stop offset="1" stop-color="#070510"/>
    </linearGradient>
    <linearGradient id="bo-ember" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E2762F"/>
      <stop offset="1" stop-color="#FFD9A0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" rx="24" fill="url(#bo-bg)"/>
  <circle cx="100" cy="380" r="150" fill="#5B3AA8" opacity="0.10"/>

  <!-- company A -->
  <g>
    <circle cx="170" cy="150" r="52" fill="#160a20" stroke="#7C5AD6" stroke-opacity="0.55" stroke-width="1.5"/>
    <circle cx="170" cy="136" r="16" fill="#5B3AA8" opacity="0.8"/>
    <path d="M142 176c6-16 50-16 56 0" fill="none" stroke="#7C5AD6" stroke-width="3" stroke-linecap="round"/>
    <text x="170" y="232" text-anchor="middle" font-family="monospace" font-size="12" letter-spacing="2" fill="#ffffff" opacity="0.6">WEB COMPANY</text>
  </g>

  <!-- company B -->
  <g>
    <circle cx="630" cy="150" r="52" fill="#160a20" stroke="#E2762F" stroke-opacity="0.6" stroke-width="1.5"/>
    <circle cx="630" cy="136" r="16" fill="#E2762F" opacity="0.85"/>
    <path d="M602 176c6-16 50-16 56 0" fill="none" stroke="#E2762F" stroke-width="3" stroke-linecap="round"/>
    <text x="630" y="232" text-anchor="middle" font-family="monospace" font-size="12" letter-spacing="2" fill="#ffffff" opacity="0.6">YOU</text>
  </g>

  <!-- handover arrow with folder -->
  <line x1="240" y1="150" x2="556" y2="150" stroke="url(#bo-ember)" stroke-width="3" stroke-dasharray="10 8" stroke-linecap="round"/>
  <path d="M556 136l30 14-30 14z" fill="#E2762F"/>

  <g transform="translate(340 96)">
    <!-- folder -->
    <path d="M0 24h44l12 14h84a10 10 0 0110 10v56a10 10 0 01-10 10H10A10 10 0 010 104V34A10 10 0 010 24z" fill="#1c1128" stroke="#FFD9A0" stroke-opacity="0.7" stroke-width="2"/>
    <rect x="16" y="52" width="58" height="7" rx="3.5" fill="#FFD9A0" opacity="0.85"/>
    <rect x="16" y="68" width="94" height="6" rx="3" fill="#ffffff" opacity="0.35"/>
    <rect x="16" y="82" width="76" height="6" rx="3" fill="#ffffff" opacity="0.25"/>
    <!-- key -->
    <g transform="translate(116 58) rotate(18)">
      <circle cx="0" cy="0" r="11" fill="none" stroke="#E2762F" stroke-width="3.5"/>
      <line x1="10" y1="0" x2="42" y2="0" stroke="#E2762F" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="34" y1="0" x2="34" y2="9" stroke="#E2762F" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="42" y1="0" x2="42" y2="7" stroke="#E2762F" stroke-width="3.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- ownership notes -->
  <g>
    <rect x="200" y="290" width="400" height="86" rx="16" fill="#160a20" stroke="#7C5AD6" stroke-opacity="0.35" stroke-width="1.5"/>
    <circle cx="236" cy="318" r="6" fill="#E2762F"/>
    <rect x="256" y="312" width="200" height="9" rx="4.5" fill="#FFD9A0" opacity="0.85"/>
    <circle cx="236" cy="348" r="6" fill="#5B3AA8"/>
    <rect x="256" y="342" width="280" height="9" rx="4.5" fill="#ffffff" opacity="0.4"/>
  </g>
  <text x="400" y="412" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#F4EEE4" opacity="0.9">Own the files, keep the key — no monthly rent</text>
</svg>
