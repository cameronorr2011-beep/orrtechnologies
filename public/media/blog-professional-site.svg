<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Illustration of a clean small business homepage with a clear headline, one call-to-action button, and a real photo">
  <defs>
    <linearGradient id="bp-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#140b1e"/>
      <stop offset="1" stop-color="#070510"/>
    </linearGradient>
    <linearGradient id="bp-ember" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E2762F"/>
      <stop offset="1" stop-color="#FFD9A0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" rx="24" fill="url(#bp-bg)"/>
  <circle cx="700" cy="70" r="150" fill="#5B3AA8" opacity="0.10"/>

  <!-- browser window -->
  <rect x="110" y="60" width="580" height="330" rx="16" fill="#160a20" stroke="#7C5AD6" stroke-opacity="0.45" stroke-width="1.5"/>
  <rect x="110" y="60" width="580" height="34" rx="16" fill="#1c1128"/>
  <circle cx="132" cy="77" r="4.5" fill="#E2762F"/>
  <circle cx="148" cy="77" r="4.5" fill="#FFD9A0" opacity="0.7"/>
  <circle cx="164" cy="77" r="4.5" fill="#7C5AD6"/>
  <rect x="300" y="70" width="200" height="14" rx="7" fill="#ffffff" opacity="0.10"/>

  <!-- clear headline -->
  <rect x="150" y="130" width="260" height="20" rx="10" fill="#F4EEE4" opacity="0.92"/>
  <rect x="150" y="162" width="200" height="20" rx="10" fill="url(#bp-ember)"/>
  <rect x="150" y="198" width="230" height="8" rx="4" fill="#ffffff" opacity="0.35"/>
  <rect x="150" y="214" width="190" height="8" rx="4" fill="#ffffff" opacity="0.25"/>

  <!-- one obvious button -->
  <rect x="150" y="244" width="132" height="34" rx="17" fill="#E2762F"/>
  <rect x="166" y="256" width="100" height="10" rx="5" fill="#070510" opacity="0.65"/>
  <rect x="150" y="296" width="90" height="7" rx="3.5" fill="#ffffff" opacity="0.2"/>
  <rect x="150" y="312" width="110" height="7" rx="3.5" fill="#ffffff" opacity="0.15"/>

  <!-- real photo block -->
  <rect x="440" y="130" width="210" height="180" rx="12" fill="#2a1533" stroke="#E2762F" stroke-opacity="0.4"/>
  <circle cx="500" cy="185" r="18" fill="#FFD9A0" opacity="0.65"/>
  <path d="M440 288l52-58 38 32 44-50 76 54v44z" fill="#5B3AA8" opacity="0.75"/>
  <text x="545" y="332" text-anchor="middle" font-family="monospace" font-size="11" letter-spacing="2" fill="#FFD9A0" opacity="0.85">REAL PHOTOS</text>

  <!-- contact strip -->
  <rect x="110" y="344" width="580" height="46" rx="0" fill="#0d0716" opacity="0.85"/>
  <rect x="150" y="360" width="90" height="8" rx="4" fill="#ffffff" opacity="0.3"/>
  <rect x="270" y="360" width="90" height="8" rx="4" fill="#ffffff" opacity="0.22"/>
  <rect x="390" y="360" width="120" height="8" rx="4" fill="#FFD9A0" opacity="0.5"/>

  <text x="400" y="428" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#F4EEE4" opacity="0.9">Clear headline, one button, real photos — that's most of it</text>
</svg>
